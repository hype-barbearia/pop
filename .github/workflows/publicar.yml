# Hype POP · testa e publica, em dois ambientes
#   branch teste → teste.pop.hypebarbearia.com (banco "Hype POP Teste", nada chega à equipe)
#   branch main  → pop.hypebarbearia.com (produção), com as etiquetas vX.Y (do CHANGELOG.md) e producao-AAAA.MM.DD-HHMM
# Cada site recebe versao.json (ferramentas/versao.js), lido pela página versoes.html.
# Nos dois casos: confere a sintaxe, abre todas as telas de todos os acessos com dados de exemplo
# (tests/smoke.js) e só então publica. Se algum teste falhar, o que está no ar continua igual.
name: Testar e publicar

on:
  push:
    branches: [main, teste]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publicar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sintaxe dos arquivos
        run: for f in js/*.js sw.js tests/*.js ferramentas/*.js ambientes/*/config.js; do node --check "$f"; done
      - name: Listas de arquivos iguais (index, service worker, testes) e configuração do teste
        run: node tests/coerencia.js
      - name: Todas as telas, todos os acessos
        run: node tests/smoke.js

  # ---------- Produção ----------
  publicar:
    needs: testar
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Montar o site (só o que o app usa)
        run: |
          mkdir _site
          cp -r index.html versoes.html sw.js manifest.webmanifest icon.svg icon-180.png icon-512.png CNAME .nojekyll css js _site/
          node ferramentas/versao.js _site producao
          # Versão da cópia offline = commit publicado: cada publicação renova a cópia guardada nos aparelhos
          sed -i "s/const CACHE = 'hype-pop-app-[^']*'/const CACHE = 'hype-pop-app-${GITHUB_SHA::7}'/" _site/sw.js
          grep -q "hype-pop-app-${GITHUB_SHA::7}" _site/sw.js
          grep -q "ambiente: 'producao'" _site/js/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

  marcar-versao:
    needs: publicar
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Etiquetas da versão publicada
        run: |
          # vX.Y = número da versão no CHANGELOG.md (só na primeira publicação dela); producao-… = cada publicação
          V=$(node -e "console.log(require('./ferramentas/versao.js').lerHistorico()[0].versao)")
          DATA="producao-$(TZ=America/Recife date +%Y.%m.%d-%H%M)"
          git tag "$DATA" "$GITHUB_SHA" && git push origin "$DATA"
          if git ls-remote --exit-code --tags origin "refs/tags/$V" >/dev/null; then
            echo "Versão $V já tinha etiqueta; esta publicação é um ajuste dela ($DATA)." >> "$GITHUB_STEP_SUMMARY"
          else
            git tag "$V" "$GITHUB_SHA" && git push origin "$V"
            echo "Versão publicada na produção: $V ($DATA)" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ---------- Teste ----------
  publicar-teste:
    needs: testar
    if: github.event_name == 'push' && github.ref == 'refs/heads/teste'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Montar o site de teste
        run: |
          mkdir _site
          cp -r index.html versoes.html sw.js manifest.webmanifest icon.svg icon-180.png icon-512.png .nojekyll css js _site/
          node ferramentas/versao.js _site teste
          cp ambientes/teste/config.js _site/js/config.js
          echo "teste.pop.hypebarbearia.com" > _site/CNAME
          sed -i "s/const CACHE = 'hype-pop-app-[^']*'/const CACHE = 'hype-pop-teste-${GITHUB_SHA::7}'/" _site/sw.js
          sed -i 's/"name": "Hype POP"/"name": "Hype POP · TESTE"/; s/"short_name": "Hype POP"/"short_name": "POP Teste"/' _site/manifest.webmanifest
          grep -q "ambiente: 'teste'" _site/js/config.js
          ! grep -q fwecscsvfxocgjspdsis _site/js/config.js
      - name: Publicar em teste.pop.hypebarbearia.com
        env:
          CHAVE: ${{ secrets.TESTE_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && echo "$CHAVE" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          cd _site
          git init -q -b gh-pages
          MSG="Teste: ${GITHUB_SHA::7} · $(git -C .. log -1 --format=%s)"
          git add -A
          git -c user.name="Hype POP" -c user.email="sistemas@hypebarbearia.com" commit -q -m "$MSG"
          git push -q -f git@github.com:hype-barbearia/pop-teste.git gh-pages
          echo "Publicado no teste: ${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"
